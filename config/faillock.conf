# Account lockout — installed to /etc/security/faillock.conf
# The pam_faillock lines already exist in /etc/pam.d/common-auth on
# Ubuntu 24.04; this file only sets the options.

# Lock the account after 3 failed attempts.
deny = 3

# Count failures inside this window (seconds).
fail_interval = 900

# 0 = stay locked until an admin runs: faillock --user <name> --reset
unlock_time = 0

# Log to the audit trail, and do not reveal to the attacker that the
# account is locked.
audit
silent
