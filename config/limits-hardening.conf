# Resource limits — installed to /etc/security/limits.d/90-hardening.conf
# Protects against local denial-of-service (e.g. a fork bomb).
# Format:  <domain> <type> <item> <value>

# Cap processes per user (stops fork bombs). hard = absolute ceiling.
*        hard    nproc       400
*        soft    nproc       200

# Cap open files per user.
*        hard    nofile      8192
*        soft    nofile      4096

# Limit simultaneous logins per user.
*        hard    maxlogins   5

# A deliberately tight limit for the test group, to demonstrate the control.
@testlimit hard  nproc       50
