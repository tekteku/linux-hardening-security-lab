# Password complexity — installed to /etc/security/pwquality.conf
# Enforced by the pam_pwquality module when a password is set/changed.

# Minimum length.
minlen = 14

# Require at least one of each class (negative = "at least this many").
dcredit = -1   # digits
ucredit = -1   # uppercase
lcredit = -1   # lowercase
ocredit = -1   # other (symbols)

# Minimum number of character classes required.
minclass = 4

# Reject the username inside the password.
usercheck = 1

# Reject too many identical or sequential characters.
maxrepeat = 3
maxsequence = 3

# How many tries the user gets interactively.
retry = 3

# Apply the rules even to root (so root sets strong passwords too).
enforce_for_root
