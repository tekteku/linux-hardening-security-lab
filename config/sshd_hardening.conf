# SSH hardening — installed to /etc/ssh/sshd_config.d/10-hardening.conf
# The main /etc/ssh/sshd_config already Includes this directory.
# Test with:  sudo sshd -t   before reloading.

# Do not allow root to log in over SSH.
PermitRootLogin no

# Keys only — no password login (stops brute-force).
PasswordAuthentication no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Only members of this group may connect.
AllowGroups sshusers

# Cut the connection after 3 failed attempts.
MaxAuthTries 3
MaxSessions 4

# Close features a server does not need.
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no

# Drop idle sessions (2 x 300s = 10 min).
ClientAliveInterval 300
ClientAliveCountMax 2

# Keep clear logs for auditing.
LogLevel VERBOSE
